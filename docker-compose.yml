version: '3.8'

services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: base64:MieY0OkJIyUT30/M0bctvkM/YxzidKx2NdWzo2zrQVk=
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: app_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: dindio
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
